name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore SteamProtonChecker.sln
      - name: Build
        run: dotnet build SteamProtonChecker.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test SteamProtonChecker.sln --configuration Release --no-build
